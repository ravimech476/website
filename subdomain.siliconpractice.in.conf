<VirtualHost *:80>
ServerName subdomain.siliconpractice.in
DocumentRoot /sync/sitedata/foundation_live/subdomain_siliconpractice_in/www


<Directory /sync/sitedata/foundation_live/subdomain_siliconpractice_in/www/>
DirectoryIndex index.php index.html
Options FollowSymLinks
AllowOverride All
Require all granted

</Directory>

include /sync/v6dashboard-release/ops/dashboard_vhost.conf


ErrorLog /var/log/apache2/error.log
CustomLog /var/log/apache2/access.log vhost_combined

SetEnvIf X-Forwarded-Proto https HTTPS=on

      <IfModule mod_rewrite.c>
          RewriteEngine On
          RewriteCond %{HTTP:X-Forwarded-Proto} =http
         RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
      </IfModule>

</VirtualHost>
